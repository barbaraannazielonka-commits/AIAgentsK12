<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periodic Table of AI Agents K-12</title>
  <meta name="description" content="A comprehensive framework of AI agents for K-12 education, organized by domain and maturity level." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; }

    /* ── Theme Variables ── */
    html.dark {
      --bg: #0a0a0a;
      --bg-card: rgba(255,255,255,0.05);
      --bg-card-hover: rgba(255,255,255,0.15);
      --bg-sidebar: rgba(0,0,0,0.6);
      --bg-panel: #18181b;
      --border: rgba(255,255,255,0.1);
      --border-panel: #27272a;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.3);
      --text-mid: rgba(255,255,255,0.6);
      --text-label: rgba(255,255,255,0.4);
      --scrollbar: #333;
      --domain-header: rgba(255,255,255,0.4);
      --selected-bg: rgba(255,255,255,0.2);
      --selected-border: #ffffff;
      --selected-ring: rgba(255,255,255,0.5);
      --btn-toggle: rgba(255,255,255,0.05);
    }
    html.light {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --bg-card-hover: #f3f4f6;
      --bg-sidebar: #f9fafb;
      --bg-panel: #ffffff;
      --border: #e5e7eb;
      --border-panel: #e5e7eb;
      --text: #111827;
      --text-muted: #9ca3af;
      --text-mid: #6b7280;
      --text-label: #6b7280;
      --scrollbar: #d1d5db;
      --domain-header: #6b7280;
      --selected-bg: #e5e7eb;
      --selected-border: #111827;
      --selected-ring: rgba(17,24,39,0.5);
      --btn-toggle: #e5e7eb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      user-select: none;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* ── Sidebar ── */
    #sidebar {
      width: 290px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--bg-sidebar);
      backdrop-filter: blur(24px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.5rem;
      gap: 0;
    }
    @media (max-width: 1023px) { #sidebar { display: none; } }

    .sidebar-toggles {
      display: flex; gap: 0.5rem;
      margin-bottom: 1.75rem;
      flex-shrink: 0;
    }
    .btn-toggle {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.45rem 0.5rem;
      border-radius: 0.5rem;
      background: var(--btn-toggle);
      color: var(--text-mid);
      border: none; cursor: pointer;
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
      transition: color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .btn-toggle:hover { color: var(--text); }
    .btn-toggle.active-theme { color: var(--text); }

    .sidebar-section-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.35em; color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .domain-filter-btn {
      width: 100%;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.35rem 0.5rem;
      border-radius: 0.4rem;
      background: transparent;
      border: none; cursor: pointer;
      font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted);
      transition: all 0.2s;
      text-align: left;
      line-height: 1.2;
    }
    .domain-filter-btn:hover { background: var(--btn-toggle); color: var(--text); }
    .domain-filter-btn.active { background: var(--btn-toggle); color: var(--text); }
    .domain-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .domain-filter-btn .domain-name { flex: 1; line-height: 1.3; }

    .clear-filter-btn {
      background: none; border: none; cursor: pointer;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: #f97316; display: flex; align-items: center; gap: 0.25rem;
      padding: 0; margin-top: 0.25rem;
    }
    .clear-filter-btn:hover { color: #fb923c; }

    .maturity-item { margin-bottom: 0.85rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border); }
    .maturity-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .maturity-name {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text); margin-bottom: 0.3rem;
    }
    .maturity-desc {
      font-size: 10px; line-height: 1.55; color: var(--text-muted);
    }

    /* ── Main ── */
    #main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; padding: 1.5rem 2rem;
      position: relative;
    }

    /* Background glow */
    #main::before {
      content: ''; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 1000px; height: 600px;
      background: radial-gradient(ellipse, rgba(16,185,129,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    html.light #main::before {
      background: radial-gradient(ellipse, rgba(16,185,129,0.08) 0%, transparent 70%);
    }

    /* Header */
    #header {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1.5rem; flex-wrap: wrap; flex-shrink: 0;
    }
    h1 {
      font-size: clamp(1.75rem, 3vw, 2.75rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(to right, #34d399, #fbbf24, #d946ef);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Grid container */
    #grid-wrap { flex: 1; overflow: auto; padding-bottom: 2rem; }
    #grid-inner { min-width: 1600px; padding: 0 1rem; }
    #grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      gap: 1rem;
    }

    /* Column */
    .domain-col { display: flex; flex-direction: column; gap: 0.625rem; }
    .domain-header {
      height: 44px; display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      text-align: center; line-height: 1.1; letter-spacing: 0.08em;
      color: var(--domain-header);
      cursor: default; transition: color 0.2s;
      margin-bottom: 1rem;
    }
    .domain-col:hover .domain-header { color: var(--text); }

    /* Agent Cell */
    .agent-cell {
      aspect-ratio: 1 / 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: space-between;
      overflow: hidden; position: relative;
      background: var(--bg-card);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s, background 0.2s, border-color 0.2s;
      will-change: transform;
    }
    .agent-cell:hover {
      transform: scale(1.15);
      z-index: 30;
      background: var(--bg-card-hover);
    }
    .agent-cell:active { transform: scale(0.92); }
    .agent-cell.selected {
      border-color: var(--selected-border);
      background: var(--selected-bg);
      box-shadow: 0 0 0 2px var(--selected-ring), 0 20px 40px rgba(0,0,0,0.3);
      z-index: 40;
    }
    .agent-cell.blurred { opacity: 0.1; filter: grayscale(1) brightness(0.3); transform: scale(0.95); }
    .agent-cell.core { background: #059669; border-color: #059669; }
    .agent-cell.trust { background: #9333ea; border-color: #9333ea; }

    .cell-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
    }
    .cell-pulse {
      width: 6px; height: 6px; border-radius: 50%; background: white;
      animation: pulse 2s infinite; align-self: flex-end;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .cell-bottom { display: flex; flex-direction: column; gap: 1px; width: 100%; }
    .cell-symbol {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem; font-weight: 800; line-height: 1;
      letter-spacing: -0.04em; color: var(--text);
    }
    .agent-cell.core .cell-symbol,
    .agent-cell.trust .cell-symbol { color: white; }
    .cell-name {
      font-size: 7px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.03em; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; color: var(--text);
      transition: font-size 0.15s;
    }
    .agent-cell.core .cell-name,
    .agent-cell.trust .cell-name { color: rgba(255,255,255,0.9); }
    .agent-cell:hover .cell-name { font-size: 8px; }

    /* ── Details Panel ── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #overlay.visible { opacity: 1; pointer-events: auto; }

    #details-panel {
      position: fixed; inset-y: 0; right: 0;
      width: 100%; max-width: 450px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-panel);
      z-index: 50;
      padding: 2rem;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: -20px 0 60px rgba(0,0,0,0.3);
    }
    #details-panel.visible { transform: translateX(0); }

    #close-btn {
      position: absolute; top: 1.5rem; right: 1.5rem;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }
    #close-btn:hover { background: var(--btn-toggle); color: var(--text); }

    .panel-header { display: flex; align-items: flex-start; gap: 1.5rem; margin-bottom: 2.5rem; margin-top: 1rem; }
    .panel-icon {
      width: 64px; height: 64px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem; font-weight: 800;
      border-radius: 12px;
      border-top: 1px solid rgba(255,255,255,0.2);
      color: white;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .panel-domain {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.2em; margin-bottom: 0.25rem;
    }
    .panel-name {
      font-size: 1.4rem; font-weight: 900; line-height: 1.1;
      color: var(--text);
    }

    .panel-body { overflow-y: auto; flex: 1; padding-right: 0.5rem; }
    .panel-body::-webkit-scrollbar { display: none; }

    .panel-section { margin-bottom: 2.5rem; }
    .panel-section-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.3em; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
    }
    .panel-section-label svg { flex-shrink: 0; }

    .panel-description {
      font-size: 1.05rem; font-weight: 500; line-height: 1.6;
      color: var(--text-mid);
      font-style: italic;
      border-left: 2px solid var(--border);
      padding: 0.5rem 0 0.5rem 1.5rem;
    }
    .panel-outcome-box {
      background: rgba(249,115,22,0.05);
      border: 1px solid rgba(249,115,22,0.2);
      border-radius: 12px; padding: 1.25rem;
      position: relative; overflow: hidden;
    }
    html.light .panel-outcome-box {
      background: #fff7ed; border-color: #fed7aa;
    }
    .panel-outcome-text {
      font-size: 1.1rem; font-weight: 700;
      color: #f97316; line-height: 1.3;
    }
    .panel-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .panel-meta-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.3em; color: var(--text-muted); margin-bottom: 0.75rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .panel-maturity {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: -0.02em; color: var(--text);
    }
    .panel-locale {
      font-size: 0.8rem; font-weight: 700; color: #3b82f6; line-height: 1.3;
    }

    /* ── Colors ── */
    .c-emerald-500  { background-color: #10b981; }
    .c-orange-500   { background-color: #f97316; }
    .c-orange-700   { background-color: #c2410c; }
    .c-amber-400    { background-color: #fbbf24; }
    .c-magenta      { background-color: #d946ef; }
    .c-red-500      { background-color: #ef4444; }
    .c-rose-500     { background-color: #f43f5e; }
    .c-teal-500     { background-color: #14b8a6; }
    .c-yellow-500   { background-color: #eab308; }
    .c-blue-600     { background-color: #2563eb; }
    .c-emerald-600  { background-color: #059669; }
    .c-indigo-500   { background-color: #6366f1; }
    .c-cyan-600     { background-color: #0891b2; }
    .c-lime-600     { background-color: #65a30d; }
    .c-pink-500     { background-color: #ec4899; }
    .c-red-700      { background-color: #b91c1c; }

    /* text versions for panel domain label */
    .t-emerald-500  { color: #10b981; }
    .t-orange-500   { color: #f97316; }
    .t-orange-700   { color: #c2410c; }
    .t-amber-400    { color: #fbbf24; }
    .t-magenta      { color: #d946ef; }
    .t-red-500      { color: #ef4444; }
    .t-rose-500     { color: #f43f5e; }
    .t-teal-500     { color: #14b8a6; }
    .t-yellow-500   { color: #eab308; }
    .t-blue-600     { color: #2563eb; }
    .t-emerald-600  { color: #059669; }
    .t-indigo-500   { color: #6366f1; }
    .t-cyan-600     { color: #0891b2; }
    .t-lime-600     { color: #65a30d; }
    .t-pink-500     { color: #ec4899; }
    .t-red-700      { color: #b91c1c; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <!-- Top toggles: language + theme -->
  <div class="sidebar-toggles">
    <button class="btn-toggle" id="lang-btn" onclick="toggleLang()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span id="lang-label">NO</span>
    </button>
    <button class="btn-toggle" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode">
      <svg id="theme-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span id="theme-label">Dark</span>
    </button>
  </div>

  <!-- Intelligence Domains -->
  <div style="margin-bottom: 0.25rem;">
    <div class="sidebar-section-label" data-i18n="intelligenceDomains">Intelligence Domains</div>
    <div id="clear-filter-wrap" style="display:none; margin-bottom:0.25rem;">
      <button class="clear-filter-btn" onclick="clearFilter()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span data-i18n="clearFilters">Clear Filters</span>
      </button>
    </div>
    <div id="domain-filters" style="margin-top:0.4rem;"></div>
  </div>

  <!-- Maturity Scale -->
  <div style="border-top: 1px solid var(--border); margin-top: 1.25rem; padding-top: 1.25rem;">
    <div class="sidebar-section-label" data-i18n="maturityScale">Maturity Scale</div>
    <div id="maturity-legend" style="margin-top:0.5rem;"></div>
  </div>
</aside>

<!-- Main -->
<main id="main">
  <header id="header">
    <h1 data-i18n="title">Periodic Table of AI Agents K-12</h1>
  </header>

  <div id="grid-wrap" class="no-scrollbar">
    <div id="grid-inner">
      <div id="grid"></div>
    </div>
  </div>
</main>

<!-- Overlay + Details Panel -->
<div id="overlay" onclick="closePanel()"></div>
<div id="details-panel" role="dialog" aria-modal="true">
  <button id="close-btn" onclick="closePanel()" aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="panel-header">
    <div class="panel-icon" id="panel-icon"></div>
    <div>
      <div class="panel-domain" id="panel-domain"></div>
      <div class="panel-name" id="panel-name"></div>
    </div>
  </div>
  <div class="panel-body">
    <div class="panel-section">
      <div class="panel-section-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span data-i18n="description">Description</span>
      </div>
      <p class="panel-description" id="panel-description"></p>
    </div>
    <div class="panel-section">
      <div class="panel-section-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" color="#f97316"><polyline points="9 18 15 12 9 6"/></svg>
        <span data-i18n="outcome">Primary Outcome</span>
      </div>
      <div class="panel-outcome-box">
        <div class="panel-outcome-text" id="panel-outcome"></div>
      </div>
    </div>
    <div class="panel-meta">
      <div>
        <div class="panel-meta-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span data-i18n="maturity">Maturity</span>
        </div>
        <div class="panel-maturity" id="panel-maturity"></div>
      </div>
      <div id="panel-locale-wrap" style="display:none;">
        <div class="panel-meta-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-i18n="locale">Locale</span>
        </div>
        <div class="panel-locale" id="panel-locale"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const MATURITY_LEVELS = ['Advisory','Operational','Process','Strategic','School-wide','Independent'];

const DOMAINS = [
  { id:'admin',   name:{en:'Leadership and Administration',      no:'Ledelse og Administrasjon',           pl:'Przywództwo i Administracja'},       color:'c-emerald-500', description:{en:'High-level school management and policy.',          no:'Overordnet skoleledelse og politikk.',                pl:'Zarządzanie szkołą i polityka.'} },
  { id:'curr',    name:{en:'Curriculum and Teaching',            no:'Læreplan og Undervisning',             pl:'Program nauczania i Dydaktyka'},      color:'c-orange-500',  description:{en:'Lesson planning and instructional delivery.',        no:'Leksjonsplanlegging og undervisning.',                 pl:'Planowanie lekcji i realizacja programu.'} },

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let lang = 'en';
let theme = 'dark';
let activeDomain = null;
let selectedAgentId = null;

function t(key) { return TRANSLATIONS[lang][key] || key; }

// ══════════════════════════════════════════════
// THEME & LANG
// ══════════════════════════════════════════════
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.className = theme;
  const icon = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  if (theme === 'dark') {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    if (label) label.textContent = 'Dark';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    if (label) label.textContent = 'Light';
  }
}

function toggleLang() {
  const langs = ['en','no','pl'];
  lang = langs[(langs.indexOf(lang) + 1) % langs.length];
  document.getElementById('lang-label').textContent = langs[(langs.indexOf(lang) + 1) % langs.length].toUpperCase();
  updateI18n();
  renderSidebar();
  renderGrid();
}

function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
}

// ══════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════
function renderSidebar() {
  // Domain filters
  const df = document.getElementById('domain-filters');
  df.innerHTML = DOMAINS.map(d => `
    <button class="domain-filter-btn ${activeDomain === d.id ? 'active' : ''}" onclick="toggleDomain('${d.id}')">
      <div class="domain-dot ${d.color}"></div>
      <span class="domain-name">${d.name[lang]}</span>
    </button>
  `).join('');

  // Maturity legend
  const ml = document.getElementById('maturity-legend');
  const keys = ['Advisory','Operational','Process','Strategic','Schoolwide','Independent'];
  ml.innerHTML = keys.map(k => `
    <div class="maturity-item">
      <div class="maturity-name">${t('maturity_' + k)}</div>
      <div class="maturity-desc">${t('maturity_' + k + '_desc')}</div>
    </div>
  `).join('');
}

function toggleDomain(id) {
  activeDomain = activeDomain === id ? null : id;
  document.getElementById('clear-filter-wrap').style.display = activeDomain ? 'block' : 'none';
  renderSidebar();
  renderGrid();
}

function clearFilter() {
  activeDomain = null;
  document.getElementById('clear-filter-wrap').style.display = 'none';
  renderSidebar();
  renderGrid();
}

// ══════════════════════════════════════════════
// GRID
// ══════════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = DOMAINS.map(domain => {
    const agents = AGENTS.filter(a => a.domainId === domain.id)
      .sort((a,b) => MATURITY_LEVELS.indexOf(a.maturity) - MATURITY_LEVELS.indexOf(b.maturity));

    return `<div class="domain-col">
      <div class="domain-header">${domain.name[lang]}</div>
      ${agents.map(agent => {
        const isBlurred = activeDomain && agent.domainId !== activeDomain;
        const isSelected = selectedAgentId === agent.id;
        const isCore = agent.isCoreSystem;
        const isTrust = agent.isTrustLayer;
        const cls = [
          'agent-cell',
          isBlurred ? 'blurred' : '',
          isSelected ? 'selected' : '',
          isCore ? 'core' : '',
          isTrust ? 'trust' : ''
        ].filter(Boolean).join(' ');
        return `<div class="${cls}" onclick="selectAgent('${agent.id}')" title="${agent.name[lang]}">
          ${!isCore && !isTrust ? `<div class="cell-bar ${domain.color}"></div>` : ''}
          ${isCore ? '<div class="cell-pulse"></div>' : '<div></div>'}
          <div class="cell-bottom">
            <div class="cell-symbol">${agent.symbol}</div>
            <div class="cell-name">${agent.name[lang]}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
// DETAILS PANEL
// ══════════════════════════════════════════════
function selectAgent(id) {
  if (selectedAgentId === id) { closePanel(); return; }
  selectedAgentId = id;
  const agent = AGENTS.find(a => a.id === id);
  const domain = DOMAINS.find(d => d.id === agent.domainId);

  // Update panel
  const icon = document.getElementById('panel-icon');
  icon.textContent = agent.symbol;
  icon.className = 'panel-icon ' + domain.color;

  const dLabel = document.getElementById('panel-domain');
  dLabel.textContent = domain.name[lang];
  dLabel.className = 'panel-domain t-' + domain.color.replace('c-','');

  document.getElementById('panel-name').textContent = agent.name[lang];
  document.getElementById('panel-description').textContent = '"' + agent.description[lang] + '"';
  document.getElementById('panel-outcome').textContent = agent.outcome[lang];

  const matKey = 'maturity_' + agent.maturity.replace('-','').replace(' ','');
  document.getElementById('panel-maturity').textContent = t(matKey);

  const localeWrap = document.getElementById('panel-locale-wrap');
  if (agent.norwegianContext) {
    localeWrap.style.display = 'block';
    document.getElementById('panel-locale').textContent = agent.norwegianContext[lang];
  } else {
    localeWrap.style.display = 'none';
  }

  document.getElementById('overlay').classList.add('visible');
  document.getElementById('details-panel').classList.add('visible');

  // Re-render grid to show selected state
  renderGrid();
}

function closePanel() {
  selectedAgentId = null;
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('details-panel').classList.remove('visible');
  renderGrid();
}

// Keyboard support
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
renderSidebar();
renderGrid();
updateI18n();
</script>
